name: Cleanup Docker Hub

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Test Docker Hub Authentication & Endpoints
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'bdekkernl' }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "=== 1. Logging in to Docker Hub ==="
          LOGIN_RES=$(curl -s -X POST https://hub.docker.com/v2/users/login/ \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"$DOCKERHUB_USERNAME\", \"password\": \"$DOCKERHUB_TOKEN\"}")
          
          TOKEN=$(echo "$LOGIN_RES" | jq -r .token)
          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "Failed to get token: $LOGIN_RES"
            exit 1
          fi
          echo "Successfully authenticated with Docker Hub."

          echo "=== 2. Testing Repository Info ==="
          curl -s -H "Authorization: Bearer $TOKEN" \
            "https://hub.docker.com/v2/namespaces/$DOCKERHUB_USERNAME/repositories/atlas/" | jq .

          echo "=== 3. Testing Tags List ==="
          curl -s -H "Authorization: Bearer $TOKEN" \
            "https://hub.docker.com/v2/namespaces/$DOCKERHUB_USERNAME/repositories/atlas/tags?page_size=100" | jq .

          echo "=== 4. Testing Possible Images / Manifests Endpoints ==="
          for endpoint in \
            "https://hub.docker.com/v2/namespaces/$DOCKERHUB_USERNAME/repositories/atlas/images" \
            "https://hub.docker.com/v2/namespaces/$DOCKERHUB_USERNAME/repositories/atlas/images-summary" \
            "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/atlas/images" \
            "https://hub.docker.com/v2/namespaces/$DOCKERHUB_USERNAME/repositories/atlas/manifests"
          do
            echo "Testing: $endpoint"
            STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$endpoint")
            echo "HTTP Status: $STATUS"
            head -n 10 /tmp/resp.json
            echo ""
          done
