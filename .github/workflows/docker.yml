name: Test, Audit & Build Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-audit:
    name: Test, Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      - name: Lint codebase
        run: npm run lint

      - name: Audit high & critical dependencies
        run: |
          npm audit --prefix server --audit-level=high
          npm audit --prefix client --audit-level=high

      - name: Run test suite
        run: npm test

      - name: Verify frontend production build
        run: npm run build --prefix client

  build-and-push:
    name: Build & Push Docker Image
    needs: test-and-audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate version metadata
        run: node scripts/generate-version.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'bdekkernl' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Git Metadata
        id: meta
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "full_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=short)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --format=%s)" >> $GITHUB_OUTPUT
          echo "count=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            bdekkernl/atlas:latest
            bdekkernl/atlas:${{ steps.meta.outputs.short_sha }}
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.full_sha }}
            GIT_BRANCH=${{ steps.meta.outputs.branch }}
            GIT_DATE=${{ steps.meta.outputs.date }}
            GIT_MESSAGE=${{ steps.meta.outputs.message }}
            GIT_COUNT=${{ steps.meta.outputs.count }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
